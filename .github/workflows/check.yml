name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm lint
      - run: nix develop -c pnpm typecheck
      - run: nix develop -c pnpm test
      - run: nix develop -c pnpm --filter @retro/frontend build

  acceptance:
    needs: frontend
    runs-on: ubuntu-latest
    # Allow cold realization of the pinned Nix shell, not a second toolchain.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        graphql-engine: [constellation, hasura]
    name: Acceptance (${{ matrix.graphql-engine }})
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      # The flake supplies Node, pnpm, Biome, Nhost CLI and matching Chromium.
      # Generated secrets/registration stay in restricted, ignored .local-test.
      - run: nix develop -c pnpm test:target provision
      - run: nix develop -c pnpm test:target health
      - run: nix develop -c pnpm test:migrations
      - run: nix develop -c pnpm test:backend
      # API permissions run on BOTH engines; browser journeys use this lane.
      # No secrets or private artifacts are uploaded.
      - run: >-
          nix develop -c pnpm test:e2e
          --engine "${{ matrix.graphql-engine }}"
      - if: always()
        run: |
          if test -f .local-test/target.json; then
            nix develop -c pnpm test:target destroy
          fi

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      # Build the named gates even on hosts that report zero flake checks.
      - run: |
          nix build --no-link \
            .#checks.x86_64-linux.nixpkgs-fmt \
            .#checks.x86_64-linux.biome-version \
            .#checks.x86_64-linux.playwright-version
