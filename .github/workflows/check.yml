name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @retro/frontend build

  acceptance:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        graphql-engine: [constellation, hasura]
    name: Acceptance (${{ matrix.graphql-engine }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Pinned native tools avoid cold source builds of the Nix dev shell.
      - run: bash scripts/install-ci-tools.sh
      - run: >-
          pnpm --filter @retro/frontend exec playwright install
          --with-deps chromium
      # Generated secrets/registration stay in restricted, ignored .local-test.
      - run: pnpm test:target provision
      - run: pnpm test:target health
      - run: pnpm test:migrations
      - run: pnpm test:backend
      # API permissions run on BOTH engines; browser journeys use this lane.
      # No secrets or private artifacts are uploaded.
      - run: >-
          pnpm test:e2e
          --engine "${{ matrix.graphql-engine }}"
      - if: always()
        run: |
          if test -f .local-test/target.json; then
            pnpm test:target destroy
          fi

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      # Build the named gates even on hosts that report zero flake checks.
      - run: |
          nix build --no-link \
            .#checks.x86_64-linux.nixpkgs-fmt \
            .#checks.x86_64-linux.biome-version \
            .#checks.x86_64-linux.playwright-version
