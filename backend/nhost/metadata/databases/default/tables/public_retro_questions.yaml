table:
  name: retro_questions
  schema: public
configuration:
  custom_name: retroQuestions
  custom_column_names:
    session_id: sessionId
    created_at: createdAt
  custom_root_fields:
    select: retroQuestions
    select_by_pk: retroQuestion
    select_aggregate: retroQuestionsAggregate
    insert: insertRetroQuestions
    insert_one: insertRetroQuestion
    update: updateRetroQuestions
    update_by_pk: updateRetroQuestion
    delete: deleteRetroQuestions
    delete_by_pk: deleteRetroQuestion
object_relationships:
  - name: session
    using:
      foreign_key_constraint_on: session_id
select_permissions:
  - role: user
    permission:
      columns: [id, session_id, text, created_at]
      allow_aggregations: false
      filter:
        _exists:
          _table: {name: retro_eligible_users, schema: public}
          _where:
            id: {_eq: X-Hasura-User-Id}
  - role: facilitator
    permission:
      columns: [id, session_id, text, created_at]
      allow_aggregations: false
      filter: &facilitator
        _exists:
          _table: {name: retro_eligible_users, schema: public}
          _where:
            id: {_eq: X-Hasura-User-Id}
            is_facilitator: {_eq: true}
insert_permissions:
  - role: facilitator
    permission:
      columns: [session_id, text]
      check: &active_facilitator
        _and:
          - *facilitator
          - session:
              ended: {_eq: false}
update_permissions:
  - role: facilitator
    permission:
      columns: [text]
      filter: *active_facilitator
      check: *active_facilitator
delete_permissions:
  - role: facilitator
    permission:
      filter: *active_facilitator
