table:
  name: retro_questions
  schema: public
configuration:
  column_config:
    created_at:
      custom_name: createdAt
    session_id:
      custom_name: sessionId
  custom_column_names:
    created_at: createdAt
    session_id: sessionId
  custom_name: retroQuestions
  custom_root_fields:
    delete: deleteRetroQuestions
    delete_by_pk: deleteRetroQuestion
    insert: insertRetroQuestions
    insert_one: insertRetroQuestion
    select: retroQuestions
    select_aggregate: retroQuestionsAggregate
    select_by_pk: retroQuestion
    update: updateRetroQuestions
    update_by_pk: updateRetroQuestion
object_relationships:
  - name: session
    using:
      foreign_key_constraint_on: session_id
array_relationships:
  - name: answers
    using:
      foreign_key_constraint_on:
        column: question_id
        table:
          name: retro_answers
          schema: public
  - name: topics
    using:
      foreign_key_constraint_on:
        column: question_id
        table:
          name: retro_topics
          schema: public
insert_permissions:
  - role: facilitator
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
                is_facilitator:
                  _eq: true
          - session:
              ended:
                _eq: false
      columns:
        - session_id
        - text
select_permissions:
  - role: facilitator
    permission:
      columns:
        - id
        - session_id
        - text
        - created_at
      filter:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
  - role: user
    permission:
      columns:
        - id
        - session_id
        - text
        - created_at
      filter:
        _and:
          - session:
              participants:
                user_id:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id

update_permissions:
  - role: facilitator
    permission:
      columns:
        - text
      filter:
        _and:
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
                is_facilitator:
                  _eq: true
          - session:
              ended:
                _eq: false
      check:
        _and:
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
                is_facilitator:
                  _eq: true
          - session:
              ended:
                _eq: false
delete_permissions:
  - role: facilitator
    permission:
      filter:
        _and:
          - _and:
              - _exists:
                  _table:
                    name: retro_eligible_users
                    schema: public
                  _where:
                    id:
                      _eq: X-Hasura-User-Id
                    is_facilitator:
                      _eq: true
              - session:
                  ended:
                    _eq: false
          - _not:
              answers: {}
