table:
  name: retro_session_participants
  schema: public
configuration:
  column_config:
    session_id:
      custom_name: sessionId
    user_id:
      custom_name: userId
  custom_column_names:
    session_id: sessionId
    user_id: userId
  custom_name: retroSessionParticipants
  custom_root_fields:
    delete: deleteRetroSessionParticipants
    insert: insertRetroSessionParticipants
    select: retroSessionParticipants
object_relationships:
  - name: account
    using:
      manual_configuration:
        column_mapping:
          user_id: id
        insertion_order: null
        remote_table:
          name: retro_participant_accounts
          schema: public
  - name: session
    using:
      foreign_key_constraint_on: session_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: facilitator
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
                is_facilitator:
                  _eq: true
          - account: {}
      columns:
        - session_id
        - user_id
select_permissions:
  - role: facilitator
    permission:
      columns:
        - session_id
        - user_id
      filter:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
  - role: user
    permission:
      columns:
        - session_id
        - user_id
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
delete_permissions:
  - role: facilitator
    permission:
      filter:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
