table:
  name: retro_answer_authors
  schema: public
configuration:
  custom_name: retroAnswerAuthors
  custom_column_names:
    display_name: displayName
  custom_root_fields:
    select: retroAnswerAuthors
    select_aggregate: retroAnswerAuthorsAggregate
array_relationships:
  - name: answers
    using:
      manual_configuration:
        remote_table: {name: retro_answers, schema: public}
        column_mapping:
          id: author_id
select_permissions:
  - role: facilitator
    permission:
      columns: [id, display_name, email]
      allow_aggregations: false
      filter:
        _exists:
          _table: {name: retro_eligible_users, schema: public}
          _where:
            id: {_eq: X-Hasura-User-Id}
            is_facilitator: {_eq: true}
