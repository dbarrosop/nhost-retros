table:
  name: retro_answer_topics
  schema: public
configuration:
  column_config:
    answer_id:
      custom_name: answerId
    question_id:
      custom_name: questionId
    topic_id:
      custom_name: topicId
  custom_column_names:
    answer_id: answerId
    question_id: questionId
    topic_id: topicId
  custom_name: retroAnswerTopics
  custom_root_fields:
    delete: deleteRetroAnswerTopics
    delete_by_pk: deleteRetroAnswerTopic
    insert: insertRetroAnswerTopics
    insert_one: insertRetroAnswerTopic
    select: retroAnswerTopics
    select_aggregate: retroAnswerTopicsAggregate
    select_by_pk: retroAnswerTopic
    update: updateRetroAnswerTopics
    update_by_pk: updateRetroAnswerTopic
object_relationships:
  - name: answer
    using:
      foreign_key_constraint_on:
        - answer_id
        - question_id
  - name: topic
    using:
      foreign_key_constraint_on:
        - topic_id
        - question_id
insert_permissions:
  - role: facilitator
    permission:
      check:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
      columns:
        - answer_id
        - question_id
        - topic_id
select_permissions:
  - role: facilitator
    permission:
      columns:
        - answer_id
        - question_id
        - topic_id
      filter:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
update_permissions:
  - role: facilitator
    permission:
      columns:
        - topic_id
      filter:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
      check:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
delete_permissions:
  - role: facilitator
    permission:
      filter:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
