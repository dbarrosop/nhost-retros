table:
  name: retro_sessions
  schema: public
configuration:
  column_config:
    created_at:
      custom_name: createdAt
  custom_column_names:
    created_at: createdAt
  custom_name: retroSessions
  custom_root_fields:
    delete: deleteRetroSessions
    delete_by_pk: deleteRetroSession
    insert: insertRetroSessions
    insert_one: insertRetroSession
    select: retroSessions
    select_aggregate: retroSessionsAggregate
    select_by_pk: retroSession
    update: updateRetroSessions
    update_by_pk: updateRetroSession
array_relationships:
  - name: participants
    using:
      foreign_key_constraint_on:
        column: session_id
        table:
          name: retro_session_participants
          schema: public
  - name: questions
    using:
      foreign_key_constraint_on:
        column: session_id
        table:
          name: retro_questions
          schema: public
insert_permissions:
  - role: facilitator
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
                is_facilitator:
                  _eq: true
          - ended:
              _eq: false
      set:
        ended: false
      columns:
        - name
select_permissions:
  - role: facilitator
    permission:
      columns:
        - id
        - name
        - ended
        - created_at
      filter:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
  - role: user
    permission:
      columns:
        - id
        - name
        - ended
        - created_at
      filter:
        _and:
          - participants:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: facilitator
    permission:
      columns:
        - name
        - ended
      filter:
        _and:
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
                is_facilitator:
                  _eq: true
          - ended:
              _eq: false
      check:
        _exists:
          _table:
            name: retro_eligible_users
            schema: public
          _where:
            id:
              _eq: X-Hasura-User-Id
            is_facilitator:
              _eq: true
delete_permissions:
  - role: facilitator
    permission:
      filter:
        _and:
          - _exists:
              _table:
                name: retro_eligible_users
                schema: public
              _where:
                id:
                  _eq: X-Hasura-User-Id
                is_facilitator:
                  _eq: true
          - ended:
              _eq: false
          - _not:
              questions: {}
